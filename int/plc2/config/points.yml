# Y1 / Y2 軸相關參數與控制點

- id: Y1_HOME
  name: "Y1回原點"
  plc: main_plc
  device: M
  address: 11
  type: bit
  writable: true
  group: "Y1"

- id: Y1_CUR_POS
  name: "Y1現在位置"
  plc: main_plc
  device: D
  address: 62
  type: int  
  writable: false
  group: "Y1"

- id: Y1_MOVE
  name: "左側前進到指定位置"
  plc: main_plc
  device: M
  address: 375
  type: bit
  writable: true
  group: "Y1"

- id: Y1_VAC_ON
  name: "左側真空"
  plc: main_plc
  device: M
  address: 50
  type: bit
  writable: true
  group: "Y1"

- id: Y1_VAC_OFF
  name: "左側破真空"
  plc: main_plc
  device: M
  address: 51
  type: bit
  writable: true
  group: "Y1"

- id: Y1_SPEED
  name: "Y1前進速度"
  plc: main_plc
  device: D
  address: 240
  type: int
  min: 1
  max: 32767
  writable: true
  group: "Y1"

- id: Y1_FWD_POS
  name: "Y1前進位置"
  plc: main_plc
  device: D
  address: 510
  type: int
  min: -32768
  max: 32767
  writable: true
  group: "Y1"

