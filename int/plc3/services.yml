services:
  home:
    command_points:
      X: X_HOME
      Y1: Y1_HOME
      Y2: Y2_HOME
    position_points:
      X: X_CUR_POS
      Y1: Y1_CUR_POS
      Y2: Y2_CUR_POS

  lift:
    height_point: X_CUR_POS
    up_point: X_FWD_POS
    down_point: X_FWD_POS
    vacuum_points:
      left: Y1_VAC_ON
      right: Y2_VAC_ON
    minimum_height_mm: 0.0
    maximum_height_mm: 1450.0

  y_axes:
    command_points:
      Y1: Y1_FWD_POS
      Y2: Y2_FWD_POS
    position_points:
      Y1: Y1_CUR_POS
      Y2: Y2_CUR_POS

  slot_vacuum:
    slots:
      Y1:
        vacuum_point: Y1_VAC_ON
        break_vacuum_point: Y1_VAC_OFF
      Y2:
        vacuum_point: Y2_VAC_ON
        break_vacuum_point: Y2_VAC_OFF
    enforcement_interval_seconds: 1.0

  middle_vacuum:
    vacuum_point: X_VAC_ON
    break_vacuum_point: X_VAC_OFF
